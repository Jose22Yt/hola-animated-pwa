name: Build NagramXF 1251 Native Icon Packs

on:
  workflow_dispatch:
  push:
    branches:
      - nagramxf-iconpacks-build
    paths:
      - ".github/workflows/nagramxf-iconpacks.yml"
      - "nagramxf-build/**"

permissions:
  contents: read

concurrency:
  group: nagramxf-iconpacks-${{ github.ref }}
  cancel-in-progress: true

env:
  NAGRAM_REF: "1251"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NDK_VERSION: "27.2.12479018"
  CMAKE_VERSION: "3.31.6"
  NATIVE_TARGET: "arm64-v8a"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct native icon-pack patch
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p patch-bundle
          cat nagramxf-build/minpatch.part1 nagramxf-build/minpatch.part2 | base64 -d > patch-bundle.zip
          unzip -q patch-bundle.zip -d patch-bundle
          test -f patch-bundle/patch/tools/apply_iconpack_patch.py
          test -f patch-bundle/patch/overlay/TMessagesProj/src/main/java/tw/nekomimi/nekogram/ui/icons/CustomIconPackManager.java

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then
            SDKMANAGER="$(find "${ANDROID_SDK_ROOT}" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Clone exact NagramXF 1251 source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --branch "${NAGRAM_REF}" --depth 1 --recurse-submodules --shallow-submodules             https://github.com/Keeperorowner/NagramXF.git NagramXF
          cd NagramXF
          git submodule update --init --recursive --depth=1
          echo "Source commit: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "30dcd6ce7b5b0279fa86f302ca61cd272bfa3068"

      - name: Apply native icon-pack patch
        shell: bash
        run: |
          set -euxo pipefail
          python patch-bundle/patch/tools/apply_iconpack_patch.py "$GITHUB_WORKSPACE/NagramXF"

          cd NagramXF

          # Hard guardrail: this port must NEVER modify the plugin Python SDK.
          if ! git diff --quiet -- TMessagesProj/src/main/assets/plugins_pysdk; then
            echo "ERROR: icon-pack patch modified plugins_pysdk."
            git diff -- TMessagesProj/src/main/assets/plugins_pysdk
            exit 1
          fi

          # Native integration must really exist before Gradle starts.
          grep -q "CustomIconPackInstaller" TMessagesProj/src/main/java/org/telegram/messenger/AndroidUtilities.java
          grep -q "CustomIconPacks" TMessagesProj/src/main/java/tw/nekomimi/nekogram/settings/NekoAppearanceSettingsActivity.java
          grep -q "pathPattern=.*icons" TMessagesProj/src/main/AndroidManifest.xml
          test -f TMessagesProj/src/main/java/tw/nekomimi/nekogram/ui/icons/CustomIconPackManager.java

          echo "Patched files:"
          git status --short

      - name: Create signing key and local.properties
        shell: bash
        run: |
          set -euxo pipefail
          cd NagramXF

          rm -f TMessagesProj/release.keystore
          keytool -genkeypair -v             -keystore TMessagesProj/release.keystore             -storepass android             -alias androidkey             -keypass android             -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=NagramXF Icon Packs, OU=Private Build, O=Jose22Yt, L=Local, ST=Local, C=CO"

          cat > local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          ndk.dir=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}
          KEYSTORE_PASS=android
          ALIAS_NAME=androidkey
          ALIAS_PASS=android
          EOF

      - name: Build Plugin ARM64 APK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          export ANDROID_NDK_HOME="${ANDROID_NDK_ROOT}"
          cd NagramXF
          chmod +x gradlew
          ./gradlew :TMessagesProj:assemblePluginDebug --no-daemon --stacktrace

      - name: Collect APK
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          find NagramXF/TMessagesProj/build/outputs/apk -type f -name "*.apk" -print -exec cp -v {} dist/ \; || true
          if compgen -G "dist/*.apk" > /dev/null; then
            sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
          else
            echo "No APK produced. Review workflow logs." > dist/BUILD_FAILED.txt
          fi

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NagramXF-1251-Native-Icon-Packs-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 14
